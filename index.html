<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vườn Phản Công - game bắn ná vật lý: bắn trái cây đánh sập pháo đài của lũ chuột qua 36 màn.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
<title>Vườn Phản Công</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed camera-driven physics stage; sticker HUD in a 3-column top bar; paper panels with ribbon headers over a blurred stage. One sunny-garden world, identical on light or dark hosts. */
:root{
  --ink:#2a1d14; --ink-soft:#6a5340;
  --paper:#fff7e3; --paper-2:#f5e1b8; --paper-3:#e9cc93;
  --mango:#ff8a1f; --mango-2:#ffb547; --mango-deep:#c75806;
  --leaf:#4fa83d; --leaf-2:#7fd05c; --leaf-deep:#2b6a24;
  --gold:#ffcd2e; --rose:#ff5d7a;
  --sky:#6cc0ee; --shade:rgba(22,14,8,.55);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,sans-serif;
  --ol3:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),2px 2px var(--ink),-2px 2px var(--ink),2px -2px var(--ink),-2px -2px var(--ink);
  --ol5:5px 0 var(--ink),-5px 0 var(--ink),0 5px var(--ink),0 -5px var(--ink),4px 4px var(--ink),-4px 4px var(--ink),4px -4px var(--ink),-4px -4px var(--ink);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:11}

/* buttons */
.btn{--b1:var(--paper);--b2:var(--paper-2);--fg:var(--ink);
  font:800 18px/1.1 var(--display);color:var(--fg);background:linear-gradient(180deg,var(--b1),var(--b2));
  border:3px solid var(--ink);border-radius:16px;padding:11px 20px 8px;cursor:pointer;position:relative;white-space:nowrap;
  box-shadow:0 5px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.75),inset 0 -3px 0 rgba(0,0,0,.08);
  transition:transform .08s ease,box-shadow .08s ease,filter .15s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 6px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.75),inset 0 -3px 0 rgba(0,0,0,.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),inset 0 2px 0 rgba(255,255,255,.5)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.primary{--b1:var(--mango-2);--b2:var(--mango);--fg:#fff;text-shadow:0 2px 0 var(--mango-deep)}
.btn.go{--b1:var(--leaf-2);--b2:var(--leaf);--fg:#fff;text-shadow:0 2px 0 var(--leaf-deep)}
.btn.xl{font-size:30px;padding:15px 48px 11px;border-radius:22px;border-width:4px;box-shadow:0 7px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.12)}
.btn.icon{width:48px;height:48px;padding:0;display:inline-grid;place-items:center;border-radius:14px}
.btn.icon svg{width:24px;height:24px}
.btn[disabled]{filter:grayscale(1) opacity(.6);cursor:not-allowed;transform:none}
.slash{display:none}
.btn[aria-pressed="false"] .slash{display:inline}
.btn[aria-pressed="false"]{--b1:#e8dcc4;--b2:#d4c4a4;color:var(--ink-soft)}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}
.hud .btn,.hud .chip{pointer-events:auto}
.hud-left{display:flex;gap:10px;align-items:center;justify-self:start;min-width:0}
.chip{background:linear-gradient(180deg,var(--paper),var(--paper-2));border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.lvl-chip{padding:5px 14px 4px;min-width:0}
.lvl-chip small{display:block;font:700 11px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.lvl-chip b{display:block;font:800 20px/1.15 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scorebox{justify-self:center;text-align:center;padding:4px 18px 6px;min-width:120px}
.score-num{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.5px;padding-top:4px}
.score-num.bump{animation:bump .25s ease}
@keyframes bump{50%{transform:scale(1.12)}}
.rats{display:flex;gap:3px;justify-content:center;margin-top:2px}
.rats svg{width:18px;height:18px;transition:opacity .3s,transform .3s}
.rats .dead{opacity:.28;filter:grayscale(1);transform:scale(.8)}
.ammo{justify-self:end;display:flex;gap:4px;align-items:center;padding:6px 10px}
.ammo canvas{width:34px;height:34px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .25s,filter .25s}
.ammo .used{opacity:.22;filter:grayscale(1);transform:scale(.8)}
.ammo .cur{transform:scale(1.22) translateY(-2px)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5;
  pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;
  font:700 16px/1.2 var(--display);padding:8px 16px 6px;background:rgba(42,29,20,.78);color:#fff;border-radius:999px;border:2px solid rgba(255,255,255,.25)}
.hint.pulse{animation:hintPulse 1.2s ease-in-out infinite}
@keyframes hintPulse{50%{transform:translateX(-50%) scale(1.05)}}

/* banners & toasts */
.banner{position:fixed;left:50%;top:30%;z-index:6;pointer-events:none;text-align:center;transform:translate(-50%,-50%);width:max-content;max-width:calc(100% - 32px)}
.banner.show{animation:bannerIn 2.3s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-90%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-20%) scale(.96)}}
.banner .eb{display:inline-block;font:800 15px/1 var(--display);letter-spacing:.24em;text-transform:uppercase;color:#fff;background:var(--ink);padding:7px 14px 5px;border-radius:999px}
.banner .nm{display:block;font:800 clamp(44px,9vw,92px)/1 var(--display);color:#fff;text-shadow:var(--ol5),0 10px 0 var(--ink);margin-top:10px}
#toasts{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:7;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{font:800 clamp(30px,6vw,52px)/1 var(--display);color:var(--gold);text-shadow:var(--ol5),0 7px 0 var(--ink);animation:toast 1.5s cubic-bezier(.2,1.5,.4,1) forwards;white-space:nowrap}
.toast.mega{font-size:clamp(52px,12vw,124px);color:#fff;text-shadow:var(--ol5),0 10px 0 var(--ink),0 0 40px rgba(255,170,50,.85)}
.toast small{display:block;font-size:.45em;color:#fff;letter-spacing:.08em;margin-top:6px}
@keyframes toast{0%{opacity:0;transform:scale(.3) rotate(-8deg)}18%{opacity:1;transform:scale(1.1) rotate(-3deg)}28%{transform:scale(1) rotate(-3deg)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px) rotate(-3deg)}}

/* overlay & panels */
#overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;overflow-y:auto;background:var(--shade);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  padding:calc(env(safe-area-inset-top,0px) + 44px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
#overlay.clear{background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 35%,rgba(20,10,0,.32) 100%);-webkit-backdrop-filter:none;backdrop-filter:none}
#overlay.soft{background:rgba(22,14,8,.42);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.panel{position:relative;width:min(560px,100%);border:4px solid var(--ink);border-radius:28px;padding:46px 26px 26px;
  background:radial-gradient(130% 90% at 50% 0%,#fffbf1 0%,var(--paper) 50%,var(--paper-2) 100%);
  box-shadow:0 10px 0 var(--ink),0 30px 70px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:16px;
  animation:panelIn .5s cubic-bezier(.2,1.35,.4,1) both}
.panel.wide{width:min(860px,100%)}
@keyframes panelIn{from{opacity:0;transform:translateY(40px) scale(.9)}}
.ribbon{position:absolute;left:50%;top:0;transform:translate(-50%,-58%) rotate(-2deg);
  background:linear-gradient(180deg,var(--mango-2),var(--mango));color:#fff;font:800 clamp(22px,4.5vw,30px)/1 var(--display);
  padding:13px 34px 9px;border:4px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);white-space:nowrap;text-shadow:0 2px 0 var(--mango-deep)}
.ribbon.green{background:linear-gradient(180deg,var(--leaf-2),var(--leaf));text-shadow:0 2px 0 var(--leaf-deep)}
.ribbon.dusk{background:linear-gradient(180deg,#8b7bd8,#5a4aa8);text-shadow:0 2px 0 #2f2470}
.eyebrow{font:700 12px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);text-align:center}
.panel h2{font:800 clamp(30px,6vw,42px)/1 var(--display);margin:0;text-align:center;text-wrap:balance}
.panel p{margin:0;line-height:1.6;max-width:60ch;text-align:center;align-self:center}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:12px;align-items:stretch}

/* title */
.title{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-bottom:4vh}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.85;filter:drop-shadow(0 18px 24px rgba(40,20,0,.25))}
.logo .l1{font:800 clamp(28px,5.5vw,56px)/1 var(--display);color:var(--leaf-2);letter-spacing:.34em;margin-right:-.34em;text-shadow:var(--ol3),0 6px 0 var(--ink);animation:fadeDown .6s .05s both}
.logo .l2{font:800 clamp(58px,13vw,156px)/.95 var(--display);color:var(--mango);display:flex;flex-wrap:nowrap;text-shadow:var(--ol5),0 12px 0 var(--ink);margin-top:.06em}
.logo .l2 span{display:inline-block;transform:rotate(var(--r));animation:drop .75s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(var(--i) * 55ms + .2s)}
.logo .l2 .sp{width:.26em}
@keyframes drop{from{opacity:0;transform:translateY(-140px) rotate(var(--r))}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}}
.hero{display:flex;gap:clamp(6px,2vw,18px);align-items:flex-end;margin-top:-6px}
.hero canvas{width:clamp(44px,8vw,72px);height:clamp(44px,8vw,72px);animation:bob 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.4s)}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.tag{font:700 clamp(15px,2.4vw,19px)/1.3 var(--display);color:#fff;background:rgba(42,29,20,.72);padding:8px 18px 6px;border-radius:999px}
.play-pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.stat{font:800 16px/1 var(--display);color:#fff;text-shadow:var(--ol3)}

/* map */
.map-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.star-pill{display:inline-flex;align-items:center;gap:6px;font:800 20px/1 var(--display);background:var(--ink);color:var(--gold);padding:8px 14px 6px;border-radius:999px}
.star-pill svg{width:20px;height:20px}
.map{position:relative;width:100%;aspect-ratio:2.25/1;border:4px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.map canvas.bg,.map svg.path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;--ns:clamp(44px,9.5vw,70px)}
.nodebtn{width:var(--ns);height:var(--ns);border-radius:50%!important;padding:0!important;font-size:calc(var(--ns) * .46)!important;color:#fff!important;
  background:linear-gradient(180deg,var(--c1),var(--c2))!important;text-shadow:var(--ol3)}
.nodebtn svg{width:46%;height:46%}
.node.locked .nodebtn{background:linear-gradient(180deg,#cfc6b6,#a59a87)!important}
.node .mini{display:flex;gap:1px}
.node .mini svg{width:15px;height:15px}
.node .name{font:700 12px/1.2 var(--body);background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:1px 7px;white-space:nowrap}
.node.current .nodebtn::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid #fff;animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
.marker{position:absolute;left:50%;bottom:calc(100% - 4px);width:38px;height:38px;transform:translateX(-50%);animation:bob 1.2s ease-in-out infinite;pointer-events:none}
.chap-nav{display:flex;align-items:center;gap:10px}
.chap-nav .btn.icon{width:42px;height:42px}
.chap-t{text-align:center;line-height:1.15;min-width:96px}
.chap-t small{display:block;font:700 11px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.chap-t b{font:800 20px/1.2 var(--display);color:var(--ink)}
.chap-dots{display:flex;justify-content:center;gap:10px}
.dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:var(--paper-2);padding:0;cursor:pointer;transition:transform .2s}
.dot.on{background:var(--mango);transform:scale(1.25)}
.dot.done{background:var(--gold)}
.dot:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
.panel.still{animation:none}
.map.in-r{animation:mapIn .35s ease both;--from:40px}
.map.in-l{animation:mapIn .35s ease both;--from:-40px}
@keyframes mapIn{from{opacity:0;transform:translateX(var(--from))}}
.subhud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 78px);left:max(16px,env(safe-area-inset-left,0px));z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:min(340px,calc(100% - 32px))}
.mini-chip{display:flex;align-items:center;gap:6px;font:700 13px/1.25 var(--body);padding:5px 11px 5px 8px;border-width:2.5px;box-shadow:0 3px 0 var(--ink);max-width:100%}
.mini-chip svg{width:18px;height:18px;flex:none}
.mini-chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-chip.met{background:linear-gradient(180deg,var(--leaf-2),var(--leaf));color:#fff}
.mini-chip.failed{opacity:.55}
.mini-chip.failed span{text-decoration:line-through}
.mini-chip.wind b{font:800 16px/1 var(--display)}
.mini-chip.wind i{font-style:normal;color:var(--mango);letter-spacing:-1px}
.banner .gl{display:block;width:max-content;max-width:100%;margin:12px auto 0;font:800 17px/1.2 var(--display);color:#fff;background:rgba(42,29,20,.82);padding:7px 16px 5px;border-radius:999px;white-space:normal}
.banner .gl.wind{background:rgba(200,80,20,.9)}
.conds{list-style:none;margin:0 auto;padding:0;display:flex;flex-direction:column;gap:6px;width:min(380px,100%)}
.conds li{display:flex;gap:8px;align-items:center;font-size:14px;line-height:1.35;color:var(--ink-soft)}
.conds li.ok{color:var(--ink);font-weight:700}
.conds svg{width:20px;height:20px;flex:none}
.art{width:150px;height:150px;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);display:block}
@media (max-width:600px){.subhud{top:calc(env(safe-area-inset-top,0px) + 70px)}.mini-chip{font-size:12px}}
.foot{font-size:13px;color:var(--ink-soft);text-align:center}

/* tutorial */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.step{background:rgba(255,255,255,.6);border:3px solid var(--ink);border-radius:18px;padding:12px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0}
.step svg{width:64px;height:64px}
.step b{font:800 20px/1 var(--display)}
.step span{font-size:13px;line-height:1.45}
.fruit-hero{width:150px;height:150px;align-self:center;animation:bob 1.4s ease-in-out infinite}
.pill{align-self:center;font:800 15px/1 var(--display);background:var(--ink);color:#fff;padding:8px 14px 6px;border-radius:999px}

/* results */
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:118px}
.star{width:84px;height:84px;overflow:visible}
.star.s1{width:112px;height:112px;margin-bottom:16px}
.star .bg{fill:rgba(42,29,20,.14);stroke:var(--ink);stroke-width:5;stroke-linejoin:round}
.star .fg{fill:url(#gGold);stroke:var(--ink);stroke-width:5;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-40deg);transition:transform .55s cubic-bezier(.3,1.9,.5,1)}
.star.on .fg{transform:scale(1) rotate(0)}
.score-big{font:800 clamp(44px,9vw,60px)/1 var(--display);text-align:center;font-variant-numeric:tabular-nums;color:var(--ink)}
.record{align-self:center;font:800 18px/1 var(--display);color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:12px;padding:8px 14px 6px;transform:rotate(-4deg);box-shadow:0 4px 0 var(--ink);animation:stamp .5s 2s cubic-bezier(.3,1.8,.5,1) both}
@keyframes stamp{from{opacity:0;transform:scale(2.2) rotate(-12deg)}}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:6px 20px;margin:0 auto;width:min(340px,100%);font-size:14px}
.breakdown dt{color:var(--ink-soft)}
.breakdown dd{margin:0;font:800 17px/1.2 var(--display);text-align:right;font-variant-numeric:tabular-nums}
.lose-art{width:130px;height:130px;align-self:center;animation:bob .5s ease-in-out infinite}

/* wipe */
#wipe{position:fixed;inset:0;z-index:20;pointer-events:none;clip-path:circle(0% at 50% 50%);
  background:radial-gradient(circle,rgba(255,255,255,.12) 0 3px,transparent 4px) 0 0/26px 26px,linear-gradient(160deg,var(--leaf),var(--leaf-deep))}

@media (max-width:600px){
  .btn.icon{width:42px;height:42px}
  .lvl-chip b{display:none}
  .lvl-chip small{font:800 16px/1.2 var(--display);letter-spacing:.02em;text-transform:none;color:var(--ink);white-space:nowrap}
  .lvl-chip{padding:7px 10px 5px}
  .score-num{font-size:22px}
  .scorebox{min-width:0;padding:3px 12px 5px}
  .rats svg{width:13px;height:13px}
  .ammo{padding:5px 6px;gap:2px}
  .ammo canvas{width:24px;height:24px}
  .node .name{display:none}
  .steps{grid-template-columns:1fr}
  .step{flex-direction:row;text-align:left}
  .step svg{width:48px;height:48px;flex:none}
  .panel{padding:40px 18px 20px}
}
@media (prefers-reduced-motion:reduce){
  .play-pulse,.hint.pulse,.hero canvas,.fruit-hero,.marker,.lose-art,.node.current .nodebtn::after{animation:none!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4b0"/><stop offset=".45" stop-color="#ffd42e"/><stop offset="1" stop-color="#f09500"/></linearGradient>
</defs></svg>

<canvas id="cv" aria-label="Sân chơi: kéo ná để bắn trái cây vào pháo đài của lũ chuột"></canvas>
<div class="hud" id="hud" hidden>
  <div class="hud-left">
    <button class="btn icon" type="button" data-act="pause" aria-label="Tạm dừng"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.5" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.5" fill="currentColor"/></svg></button>
    <div class="chip lvl-chip"><small id="hLvlNo">Màn 1/6</small><b id="hLvlName">Luống rau</b></div>

const midi = n => 440 * Math.pow(2, (n - 69) / 12);

cv.addEventListener('pointerdown', e => {
  ensureAudio();
  if (screen !== 'game') return;
  if (state === 'intro') { introStart = realTime - 5000; finishIntro(); return; }
  if (state === 'aim') {
    const p = toWorld(e), near = Math.hypot(p.x - ANCHOR.x, p.y - ANCHOR.y) < Math.max(90, 80 / cam.s);
    cv.setPointerCapture(e.pointerId);
    if (near && !loadAnim) { setDrag(p); SFX.stretch(); lastPct = 0; }
    else pan = { x: e.clientX, start: panX };
  } else if (state === 'flying') useAbility();
});
cv.addEventListener('pointermove', e => {
  if (drag) setDrag(toWorld(e));
  else if (pan) panX = pan.start - (e.clientX - pan.x) / cam.s;
  else if (screen === 'game' && state === 'aim') { const p = toWorld(e); cv.style.cursor = Math.hypot(p.x - ANCHOR.x, p.y - ANCHOR.y) < Math.max(90, 80 / cam.s) ? 'grab' : 'default'; }

});
function setDrag(p) {
  let d = { x: p.x - ANCHOR.x, y: p.y - ANCHOR.y };
  const m = Math.hypot(d.x, d.y);
  if (m > MAXPULL) d = Vector.mult(d, MAXPULL / m);
  if (ANCHOR.y + d.y > G - 22) d.y = G - 22 - ANCHOR.y;
  drag = d; cv.style.cursor = 'grabbing';

}

  if (pan) { pan = null; return; }
  if (!drag) return;
  const d = drag; drag = null; cv.style.cursor = 'grab';
  if (Math.hypot(d.x, d.y) > 18 && state === 'aim') launch(d);
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', () => { drag = null; pan = null; });
addEventListener('keydown', e => {
  if (screen !== 'game') return;
  if (e.key === 'Escape') { state === 'paused' ? resume() : openPause(); }
  else if ((e.key === 'r' || e.key === 'R') && overlay.hidden) loadLevel(levelIndex, { quick: true });
  else if (e.key === ' ' && state === 'flying') { e.preventDefault(); useAbility(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (screen === 'game' && ['aim', 'flying', 'intro'].includes(state)) openPause(); if (actx) actx.suspend(); }
  else if (actx) actx.resume();
});

  if (!dark) for (let i = 0; i < 60; i++) { c.fillStyle = ['#fff', '#ffd84a', '#ff8fb1'][i % 3]; c.beginPath(); c.arc(R() * w, R() * h, 1.6 + R() * 1.4, 0, TAU); c.fill(); }
}
function startLevel(i) {
  wipe(() => { closeOverlay(); screen = 'game'; setHud(true); loadLevel(i); });
}
function openPause() {
  if (screen !== 'game' || !['aim', 'flying', 'intro'].includes(state)) return;
  prevState = state; state = 'paused'; pauseAt = realTime; drag = null; pan = null;
  openOverlay(`
    <div class="panel">
      <div class="ribbon">Tạm dừng</div>
      <div class="eyebrow">Màn ${levelIndex + 1} · ${LEVELS[levelIndex].name}</div>
      <div class="col">
        <button class="btn go xl" type="button" data-act="resume" data-focus>Tiếp tục</button>
        <div class="row"><button class="btn" type="button" data-act="restart">Chơi lại</button><button class="btn" type="button" data-act="map">Bản đồ</button></div>
      </div>
      <div class="row">${toggles()}</div>
      <p class="foot">Phím tắt: Esc tạm dừng · R chơi lại · Space dùng chiêu</p>
    </div>`);
}
function resume() {
  if (state !== 'paused') return;
  if (prevState === 'intro') introStart += realTime - pauseAt;
  state = prevState; closeOverlay();
}
const STEP_ICONS = [
  '<svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="16" fill="#ffb02e" stroke="#2a1d14" stroke-width="3"/><path d="M40 12l6 10-10 2" fill="#fff" stroke="#2a1d14" stroke-width="3" stroke-linejoin="round"/><circle cx="26" cy="32" r="3" fill="#2a1d14"/><circle cx="37" cy="32" r="3" fill="#2a1d14"/></svg>',
  '<svg viewBox="0 0 64 64"><path d="M50 14 L18 42" stroke="#2a1d14" stroke-width="4" stroke-dasharray="2 7" stroke-linecap="round"/><circle cx="16" cy="44" r="11" fill="#ffb02e" stroke="#2a1d14" stroke-width="3"/><path d="M44 12h8v8" fill="none" stroke="#2a1d14" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  '<svg viewBox="0 0 64 64"><path d="M8 52 Q30 4 56 40" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="3 7" stroke-linecap="round"/><path d="M8 52 Q30 4 56 40" fill="none" stroke="#2a1d14" stroke-width="1.5" stroke-dasharray="3 7" stroke-linecap="round" opacity=".5"/><circle cx="52" cy="44" r="9" fill="#c4bdb2" stroke="#2a1d14" stroke-width="3"/><path d="M47 40l3 3m0-3l-3 3M54 40l3 3m0-3l-3 3" stroke="#2a1d14" stroke-width="2"/></svg>'
];
function showHowTo() {
  openOverlay(`
    <div class="panel">
      <div class="ribbon green">Cách chơi</div>
      <h2>Lũ chuột chiếm vườn rồi!</h2>
      <div class="steps">
        <div class="step">${STEP_ICONS[0]}<div><b>Chạm</b><br><span>Đặt ngón tay hoặc chuột lên trái cây đang nằm trên ná.</span></div></div>
        <div class="step">${STEP_ICONS[1]}<div><b>Kéo</b><br><span>Kéo ra sau để ngắm. Kéo càng xa, bắn càng mạnh.</span></div></div>
        <div class="step">${STEP_ICONS[2]}<div><b>Thả</b><br><span>Thả tay để bắn. Hạ hết chuột để qua màn.</span></div></div>
      </div>

    </div>`);
}
function showFruitCard(k) {
  const F = FRUITS[k];
  openOverlay(`
    <div class="panel">
      <div class="ribbon">Trái cây mới!</div>
      <div id="fh" style="align-self:center"></div>
      <h2>${F.name}</h2>
      <p>${F.intro}</p>
      <span class="pill">${F.hint}</span>
      <div class="row"><button class="btn primary xl" type="button" data-act="tut-ok" data-k="${k}" data-focus>Rõ rồi</button></div>
    </div>`);
  const c = fruitCanvas(k, 150, 'determined'); c.className = 'fruit-hero'; $('fh').appendChild(c);
}
function bigStars() { return `<div class="stars">${[0, 1, 2].map(i => `<svg class="star s${i}" viewBox="0 0 100 100"><path class="bg" d="${STAR_D}"/><path class="fg" d="${STAR_D}"/></svg>`).join('')}</div>`; }
function showResult(win, starsN, record) {
  const L = LEVELS[levelIndex], hasNext = win && levelIndex + 1 < LEVELS.length;
  if (win) {
    openOverlay(`
      <div class="panel">
        <div class="ribbon">Sạch bóng chuột!</div>
        <div class="eyebrow">Màn ${levelIndex + 1} · ${L.name}</div>
        ${bigStars()}
        <div class="score-big" id="rScore">0</div>
        ${record ? '<div class="record">Kỷ lục mới!</div>' : ''}
        <ul class="conds">${[['Hạ hết chuột', lastConds[0]], ['Còn dư ít nhất 1 lượt bắn', lastConds[1]], ['Thử thách: ' + goalText(), lastConds[2]]].map(([t, ok]) => `<li class="${ok ? 'ok' : ''}">${IC.star(ok)}<span>${t}</span></li>`).join('')}</ul>
        <dl class="breakdown">
          <dt>Công trình bị phá</dt><dd>${fmt(stats.blocks)}</dd>
          <dt>Chuột bị hạ</dt><dd>${fmt(stats.rats)}</dd>
          <dt>Tiền thưởng</dt><dd>${fmt(stats.bonus)}</dd>
        </dl>
        <div class="row">
          ${hasNext ? '<button class="btn primary xl" type="button" data-act="next" data-focus>Màn tiếp</button>' : ''}
          <button class="btn" type="button" data-act="restart" ${hasNext ? '' : 'data-focus'}>Chơi lại</button>
          <button class="btn" type="button" data-act="map">Bản đồ</button>
        </div>
        ${!hasNext ? '<p class="foot">Bạn đã dọn sạch cả khu vườn. Thử chơi lại để gom đủ 3 sao mỗi màn.</p>' : ''}
      </div>`, 'soft');
    for (let i = 0; i < starsN; i++) setTimeout(() => {
      const el = overlay.querySelector('.star.s' + i); if (!el) return;
      el.classList.add('on'); SFX.star(i);
      const r = el.getBoundingClientRect(); confettiBurst(r.left + r.width / 2, r.top + r.height / 2, 22);
    }, 500 + i * 420);
    setTimeout(() => { if (!overlay.hidden) confettiRain(90); }, 500 + starsN * 420);
    countUp($('rScore'), score, 350, 1300);
  } else {
    const hasStone = bodies.some(b => b.game.mat === 'stone');
    const tip = hasStone && !shots.includes('coco') ? 'Bắn vào chân cột để cả tầng trên đổ xuống đè chuột.' : hasStone ? 'Dừa nặng, phá tường đá tốt hơn xoài.' : 'Bắn vào chân cột để cả tầng trên đổ xuống đè chuột.';
    openOverlay(`
      <div class="panel">
        <div class="ribbon dusk">Hết trái cây rồi</div>
        <div class="eyebrow">Màn ${levelIndex + 1} · ${L.name}</div>
        <canvas class="lose-art" id="loseArt" width="260" height="260"></canvas>
        <h2>Còn ${ratsAlive} con chuột</h2>
        <p>${tip}</p>
        <div class="row">
          <button class="btn primary xl" type="button" data-act="restart" data-focus>Thử lại</button>
          <button class="btn" type="button" data-act="map">Bản đồ</button>
        </div>
      </div>`, 'soft');
    const la = $('loseArt').getContext('2d'); la.scale(2, 2);
    drawRat(la, 65, 72, 0, 40, { hp: 26, max: 26, flash: 0, look: { x: 0, y: 1 }, laugh: true, ph: 0 });
  }
}
function countUp(el, to, delay, dur) {
  if (!el) return;
  const t0 = performance.now() + delay; let lastTick = 0;
  const f = now => {
    if (!el.isConnected) return;
    const t = clamp((now - t0) / dur, 0, 1), v = to * (1 - Math.pow(1 - t, 3));
    el.textContent = fmt(v);
    if (t > 0 && t < 1 && now - lastTick > 70) { lastTick = now; SFX.count(); }
    if (t < 1) requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  ensureAudio(); SFX.click();
  const act = b.dataset.act;
  if (act === 'play') { (totalStars() === 0 && progress.unlocked === 1) ? startLevel(0) : showMap(); }
  else if (act === 'title') showTitle();
  else if (act === 'map') { if (screen === 'game') wipe(showMap); else showMap(); }
  else if (act === 'lvl') startLevel(+b.dataset.lvl);
  else if (act === 'chap') { const n = +b.dataset.ch; showMap(n, n > mapChapter ? 1 : -1); }
  else if (act === 'next') startLevel(levelIndex + 1);
  else if (act === 'restart') { closeOverlay(); loadLevel(levelIndex, { quick: true }); }
  else if (act === 'pause') openPause();
  else if (act === 'resume') resume();
  else if (act === 'tut-ok') {
    progress.seen[b.dataset.k] = true; if (b.dataset.k === 'howto') progress.seen.mango = true; save();
    closeOverlay(); state = 'intro'; introStart = realTime - 5000; finishIntro();
  }
  else if (act === 'toggle-sound' || act === 'toggle-music') {
    const key = act === 'toggle-sound' ? 'sound' : 'music'; progress[key] = !progress[key]; save(); applyAudio();
    document.querySelectorAll(`[data-act="${act}"]`).forEach(x => x.setAttribute('aria-pressed', progress[key]));
  }
});

// ================= LOOP =================
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1), cw = innerWidth, ch = innerHeight;
  for (const c of [cv, fx]) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
  view = { dpr, cw, ch };
  const bg = $('mapbg'); if (bg) paintMap(bg, CHAPTERS[mapChapter].map);
  if (engine) updateHud();
}
addEventListener('resize', resize);
let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(100, now - last); last = now; realTime += dt;
  const target = realTime < slowUntil ? .28 : 1; timeScale += (target - timeScale) * .15;
  const running = engine && state !== 'paused' && (screen === 'game' || state === 'attract') && realTime >= hitStopUntil;
  frameDt = dt; edgeGlow *= Math.pow(.25, dt / 1000); bars += ((realTime < cineUntil ? 1 : 0) - bars) * Math.min(1, dt / 120);
  if (running) {
    acc += dt * timeScale; let n = 0;
    while (acc >= STEP && n < 6) {
      envStep(); Engine.update(engine, STEP); simTime += STEP; stepGame(); updateParticles();
      shake *= .88; if (shake < .3) shake = 0; flash *= .9;
      acc -= STEP; n++;
    }
    if (n >= 6) acc = 0;
  }
  if (state === 'intro' && realTime - introStart > 2300) finishIntro();
  if (loadAnim && realTime - loadAnim.t0 > loadAnim.dur) { loadAnim = null; updateHud(); }
  if (engine) { updateCamera(dt); render(); }
  if (screen === 'game') tickScore(dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}
function start(data) {
  resize();
  const d = data || {};
  if (d.screen === 'game' && Number.isInteger(d.level)) { screen = 'game'; setHud(true); loadLevel(clamp(d.level, 0, LEVELS.length - 1), { quick: true }); }
  else showTitle();
  requestAnimationFrame(loop);
}
const hot = window.claude && window.claude.hot;
try { hot && hot.snapshot && hot.snapshot(() => ({ screen, level: levelIndex })); } catch (e) {}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
