<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vườn Phản Công - game bắn ná vật lý: bắn trái cây đánh sập pháo đài của lũ chuột qua 48 màn, 8 chương.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
<title>Vườn Phản Công</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sriracha&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: the garden stage is the whole screen. UI is cut from indigo-dyed cloth (vải chàm) with a woven brocade border (thổ cẩm),
   red-lacquer (sơn son) actions and a red seal for titles, lettered by hand like a market sign. The title menu hangs on the left
   like a festival banner (phướn). One look, the same on light or dark hosts. */
:root{
  --cham:#1c2847; --cham-2:#26365e; --cham-3:#3b5085; --cham-glass:rgba(22,32,58,.86);
  --giay:#f3e9d3; --giay-dim:rgba(243,233,211,.66); --giay-line:rgba(243,233,211,.16);
  --son:#c4392b; --son-deep:#7f1f16; --vang:#e9b13a; --la:#4f9a3a; --than:#15120f;
  --hand:"Sriracha","Comic Sans MS",cursive;
  --body:"Be Vietnam Pro",system-ui,sans-serif;
  --display:var(--hand);
  /* legacy names still used by a few rules */
  --ink:var(--than); --ink-soft:var(--giay-dim); --paper:var(--giay); --paper-2:#e6d6b4; --mango:var(--son); --leaf:var(--la); --leaf-2:#7fbf55; --gold:var(--vang);
  --brocade:repeating-linear-gradient(90deg,transparent 0 6px,var(--vang) 6px 8px,transparent 8px 14px),
    linear-gradient(45deg,transparent 35%,var(--son) 35% 65%,transparent 65%) 0 0/14px 14px,
    linear-gradient(-45deg,transparent 35%,var(--son) 35% 65%,transparent 65%) 0 0/14px 14px,var(--cham-2);
  --ol:2px 0 var(--than),-2px 0 var(--than),0 2px var(--than),0 -2px var(--than),2px 2px var(--than),-2px 2px var(--than),2px -2px var(--than),-2px -2px var(--than);
  --ol5:4px 0 var(--than),-4px 0 var(--than),0 4px var(--than),0 -4px var(--than),3px 3px var(--than),-3px 3px var(--than),3px -3px var(--than),-3px -3px var(--than);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#6cc0ee;color:var(--giay);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:11}
button{font-family:inherit}

/* buttons: cloth by default, red lacquer for the one action that matters */
.btn{font:700 15px/1.15 var(--body);color:var(--giay);background:var(--cham-2);border:1.5px solid var(--giay-line);border-radius:6px;
  padding:10px 16px;cursor:pointer;position:relative;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{border-color:var(--vang)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--vang);outline-offset:3px}
.btn.primary{font:400 24px/1.1 var(--hand);color:#fff8e6;background:var(--son);border:0;padding:12px 28px 13px;
  box-shadow:inset 0 0 0 2px var(--son),inset 0 0 0 3.5px var(--vang),0 3px 0 var(--son-deep)}
.btn.primary:hover{background:#d24432}
.btn.go{color:#fff;background:var(--la);border-color:transparent;box-shadow:0 3px 0 #2c5f1f}
.btn.xl{font-size:28px;padding:13px 40px 15px}
.btn.icon{width:44px;height:44px;padding:0;display:inline-grid;place-items:center}
.btn.icon svg{width:22px;height:22px}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none;border-color:var(--giay-line)}
.slash{display:none}
.btn[aria-pressed="false"] .slash{display:inline}
.btn[aria-pressed="false"]{color:var(--giay-dim)}
.btn small.sub{display:block;font:500 12px/1.25 var(--body);color:var(--giay-dim);margin-top:3px;white-space:normal}

/* HUD: cloth tags on the stage */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}
.hud .btn,.hud .chip{pointer-events:auto}
.hud .btn.icon{background:var(--cham-glass);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hud-left{display:flex;gap:8px;align-items:center;justify-self:start;min-width:0}
.chip{background:var(--cham-glass);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--giay-line);border-radius:6px;color:var(--giay)}
.lvl-chip{padding:6px 12px 7px;min-width:0}
.lvl-chip small{display:block;font:700 10.5px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--vang)}
.lvl-chip b{display:block;font:400 20px/1.15 var(--hand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scorebox{justify-self:center;text-align:center;padding:5px 18px 7px;min-width:120px;border-top:3px solid var(--vang)}
.score-num{font:800 28px/1 var(--body);font-variant-numeric:tabular-nums;letter-spacing:-.01em;padding-top:2px}
.score-num.bump{animation:bump .25s ease}
@keyframes bump{50%{transform:scale(1.1)}}
.rats{display:flex;gap:3px;justify-content:center;margin-top:4px}
.rats svg{width:17px;height:17px;transition:opacity .3s,transform .3s}
.rats .dead{opacity:.25;filter:grayscale(1);transform:scale(.8)}
.ammo{justify-self:end;display:flex;gap:4px;align-items:center;padding:6px 10px}
.ammo canvas{width:34px;height:34px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .25s,filter .25s}
.ammo .used{opacity:.22;filter:grayscale(1);transform:scale(.8)}
.ammo .cur{transform:scale(1.2) translateY(-2px)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5;
  pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;
  font:600 15px/1.2 var(--body);padding:8px 14px;background:var(--cham-glass);color:var(--giay);border-radius:6px;border-left:3px solid var(--vang)}
.hint.pulse{animation:hintPulse 1.2s ease-in-out infinite}
@keyframes hintPulse{50%{transform:translateX(-50%) scale(1.04)}}

/* banners & toasts: hand-lettered, like chalk on a market board */
.banner{position:fixed;left:50%;top:30%;z-index:6;pointer-events:none;text-align:center;transform:translate(-50%,-50%);width:max-content;max-width:calc(100% - 32px)}
.banner.show{animation:bannerIn 2.3s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-62%)}12%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-44%)}}
.banner .eb{display:inline-block;font:700 12px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--vang);background:var(--cham);padding:7px 12px}
.banner .nm{display:block;font:400 clamp(44px,8.5vw,88px)/1.05 var(--hand);color:#fff8e6;text-shadow:var(--ol5),0 6px 0 var(--than);margin-top:8px}
.banner .gl{display:block;width:max-content;max-width:100%;margin:10px auto 0;font:600 15px/1.25 var(--body);color:var(--giay);background:var(--cham-glass);padding:7px 14px;border-radius:4px;white-space:normal}
.banner .gl.wind{background:var(--son)}
#toasts{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:7;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{font:400 clamp(30px,5.6vw,50px)/1.05 var(--hand);color:var(--vang);text-shadow:var(--ol5),0 5px 0 var(--than);animation:toast 1.5s cubic-bezier(.2,1.4,.4,1) forwards;white-space:nowrap;text-align:center}
.toast.mega{font-size:clamp(52px,11vw,116px);color:#fff8e6;text-shadow:var(--ol5),0 8px 0 var(--than)}
.toast small{display:block;font:600 .34em/1.2 var(--body);color:#fff;letter-spacing:.02em;margin-top:6px;text-shadow:var(--ol)}
@keyframes toast{0%{opacity:0;transform:scale(.5) rotate(-6deg)}18%{opacity:1;transform:scale(1.06) rotate(-2deg)}28%{transform:scale(1) rotate(-2deg)}80%{opacity:1}100%{opacity:0;transform:translateY(-24px) rotate(-2deg)}}

/* overlay & panels: indigo cloth with a woven band along the top */
#overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;overflow-y:auto;background:rgba(9,13,28,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
#overlay.clear{background:linear-gradient(90deg,rgba(9,13,28,.45),rgba(9,13,28,0) 55%);-webkit-backdrop-filter:none;backdrop-filter:none;place-items:stretch start;padding-top:0;padding-bottom:0}
#overlay.soft{background:rgba(9,13,28,.4);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.panel{position:relative;width:min(560px,100%);box-sizing:border-box;border-radius:4px;padding:30px 26px 24px;color:var(--giay);
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 2px,transparent 2px 4px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),var(--cham);
  box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 0 0 1px var(--giay-line);display:flex;flex-direction:column;gap:16px;
  animation:panelIn .35s cubic-bezier(.2,.9,.3,1) both}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:var(--brocade);border-bottom:2px solid var(--vang);border-radius:4px 4px 0 0}
.panel.wide{width:min(880px,100%)}
@keyframes panelIn{from{opacity:0;transform:translateY(18px)}}
.ribbon{display:flex;align-items:center;gap:12px;font:400 clamp(26px,4.6vw,34px)/1.1 var(--hand);color:#fff8e6;margin:4px 0 -4px;text-wrap:balance}
.ribbon::before{content:"";flex:none;width:22px;height:22px;background:radial-gradient(circle,#fff8e6 0 2.5px,transparent 3px),var(--son);border:2px solid #fff8e6;outline:2.5px solid var(--son);border-radius:2px;transform:rotate(45deg) scale(.86)}
.ribbon.green::before{background-color:var(--la);outline-color:var(--la)}
.ribbon.dusk::before{background-color:var(--cham-3);outline-color:var(--cham-3)}
.eyebrow{font:700 11.5px/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--vang)}
.panel h2{font:400 clamp(28px,5.5vw,38px)/1.1 var(--hand);margin:0;text-wrap:balance;color:#fff8e6}
.panel p{margin:0;line-height:1.6;max-width:62ch}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-start;align-items:center}
.col{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.foot{font-size:13px;line-height:1.5;color:var(--giay-dim)}

/* title: a hanging festival banner on the left of the live garden */
.title{box-sizing:border-box;width:min(400px,100%);min-height:100%;display:flex;flex-direction:column;align-items:flex-start;gap:16px;
  padding:env(safe-area-inset-top,0px) 26px 48px;background:var(--cham);box-shadow:0 0 50px rgba(0,0,0,.35);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),75% 100%,50% calc(100% - 22px),25% 100%,0 calc(100% - 22px));animation:hang .6s cubic-bezier(.2,.9,.3,1) both}
@keyframes hang{from{transform:translateY(-30px);opacity:0}}
.title::before{content:"";flex:none;align-self:stretch;height:14px;margin:0 -26px clamp(8px,3vh,24px);background:var(--brocade);border-block:2px solid var(--vang)}
.logo{margin:0;display:flex;flex-direction:column;line-height:.9}
.logo .l1{font:700 13px/1 var(--body);letter-spacing:.42em;text-transform:uppercase;color:var(--vang);margin-bottom:6px}
.logo .l2{font:400 clamp(52px,8vw,76px)/.95 var(--hand);color:#fff8e6;text-shadow:0 4px 0 var(--son)}
.logo .seal{display:inline-grid;place-items:center;width:46px;height:46px;margin-top:12px;background:var(--son);color:#fff8e6;font:400 15px/1 var(--hand);border-radius:3px;transform:rotate(-6deg);box-shadow:inset 0 0 0 2px var(--son),inset 0 0 0 4px #fff8e6;text-align:center;line-height:1}
.tag{margin:0;font:500 15px/1.5 var(--body);color:var(--giay-dim);max-width:30ch}
.modes{display:flex;flex-direction:column;align-self:stretch;border-top:1px solid var(--giay-line)}
.modes .btn{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:none;border:0;border-bottom:1px solid var(--giay-line);border-radius:0;padding:12px 2px;font:400 21px/1.1 var(--hand);text-align:left}
.modes .btn:hover:not([disabled]){color:var(--vang)}
.modes .btn small.sub{margin:0;text-align:right;font-size:12px}
.title .row{gap:8px}
.stat{font:700 14px/1 var(--body);color:var(--vang);font-variant-numeric:tabular-nums}
.revive{display:flex;flex-direction:column;gap:6px;font:700 11.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--giay-dim)}
.revive span{display:flex;gap:4px}
.revive i{width:22px;height:8px;background:var(--giay-line)}
.revive i.on{background:var(--la)}
.hero{display:none}
.play-pulse{animation:none}
@media (max-width:600px){.title{width:100%;min-height:0;padding-bottom:40px}#overlay.clear{place-items:start stretch;background:none}.logo .l2{font-size:54px}}

/* map */
.map-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.star-pill{display:inline-flex;align-items:center;gap:6px;font:700 15px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--vang);padding:7px 0}
.star-pill svg{width:18px;height:18px}
.star-pill.xu{color:var(--giay)}
.map{position:relative;width:100%;aspect-ratio:2.25/1;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--giay-line),0 0 0 6px var(--cham-2)}
.map canvas.bg,.map svg.path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;--ns:clamp(42px,9vw,64px)}
.nodebtn{width:var(--ns);height:var(--ns);border-radius:50%!important;padding:0!important;font:400 calc(var(--ns) * .44)/1 var(--hand)!important;color:#fff8e6!important;
  background:var(--son)!important;border:3px solid #fff8e6!important;box-shadow:0 3px 0 var(--son-deep)!important;display:grid!important;place-items:center}
.nodebtn svg{width:44%;height:44%}
.node.locked .nodebtn{background:var(--cham-2)!important;border-color:var(--giay-line)!important;box-shadow:none!important}
.node .mini{display:flex;gap:1px}
.node .mini svg{width:14px;height:14px}
.node .name{font:600 11.5px/1.2 var(--body);color:var(--giay);background:var(--cham);border-radius:3px;padding:2px 7px;white-space:nowrap}
.node.current .nodebtn::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--vang);animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
.marker{position:absolute;left:50%;bottom:calc(100% - 4px);width:38px;height:38px;transform:translateX(-50%);animation:bob 1.2s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}
.chap-nav{display:flex;align-items:center;gap:10px}
.chap-nav .btn.icon{width:40px;height:40px}
.chap-t{text-align:center;line-height:1.15;min-width:96px}
.chap-t small{display:block;font:700 10.5px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--giay-dim)}
.chap-t b{font:700 16px/1.3 var(--body);color:var(--vang);font-variant-numeric:tabular-nums}
.chap-dots{display:flex;justify-content:center;gap:8px}
.dot{width:26px;height:8px;border:0;border-radius:0;background:var(--giay-line);padding:0;cursor:pointer;transition:background .2s}
.dot.on{background:var(--son)}
.dot.done{background:var(--vang)}
.dot:focus-visible{outline:2px solid var(--vang);outline-offset:3px}
.panel.still{animation:none}
.map.in-r{animation:mapIn .35s ease both;--from:40px}
.map.in-l{animation:mapIn .35s ease both;--from:-40px}
@keyframes mapIn{from{opacity:0;transform:translateX(var(--from))}}

/* goal / wind chips under the HUD */
.subhud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 76px);left:max(16px,env(safe-area-inset-left,0px));z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:min(340px,calc(100% - 32px))}
.mini-chip{display:flex;align-items:center;gap:6px;font:600 13px/1.25 var(--body);padding:5px 10px 5px 7px;max-width:100%}
.mini-chip svg{width:17px;height:17px;flex:none}
.mini-chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-chip.met{background:var(--la);border-color:transparent;color:#fff}
.mini-chip.failed{opacity:.55}
.mini-chip.failed span{text-decoration:line-through}
.mini-chip.wind b{font:800 15px/1 var(--body);font-variant-numeric:tabular-nums}
.mini-chip.wind i{font-style:normal;color:var(--vang);letter-spacing:-1px}
@media (max-width:600px){.subhud{top:calc(env(safe-area-inset-top,0px) + 68px)}.mini-chip{font-size:12px}}

/* results */
.conds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.conds li{display:flex;gap:8px;align-items:center;font-size:14px;line-height:1.35;color:var(--giay-dim)}
.conds li.ok{color:var(--giay);font-weight:600}
.conds svg{width:19px;height:19px;flex:none}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:112px}
.star{width:80px;height:80px;overflow:visible}
.star.s1{width:106px;height:106px;margin-bottom:14px}
.star .bg{fill:rgba(243,233,211,.12);stroke:var(--than);stroke-width:5;stroke-linejoin:round}
.star .fg{fill:url(#gGold);stroke:var(--than);stroke-width:5;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-40deg);transition:transform .5s cubic-bezier(.3,1.7,.5,1)}
.star.on .fg{transform:scale(1) rotate(0)}
.score-big{font:800 clamp(42px,8.5vw,58px)/1 var(--body);letter-spacing:-.02em;text-align:center;font-variant-numeric:tabular-nums;color:#fff8e6}
.record{align-self:center;font:400 19px/1 var(--hand);color:#fff8e6;background:var(--son);padding:9px 14px 10px;border-radius:3px;transform:rotate(-5deg);box-shadow:inset 0 0 0 2px var(--son),inset 0 0 0 3.5px #fff8e6;animation:stamp .45s 2s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{opacity:0;transform:scale(2) rotate(-12deg)}}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:6px 20px;margin:0;font-size:14px;border-top:1px solid var(--giay-line);padding-top:12px}
.breakdown dt{color:var(--giay-dim)}
.breakdown dd{margin:0;font:700 15px/1.3 var(--body);text-align:right;font-variant-numeric:tabular-nums}
.lose-art{width:120px;height:120px;align-self:center;animation:wob .5s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-6px) rotate(-4deg)}}

/* boss bar */
.bossbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 62px);z-index:5;pointer-events:none;width:min(380px,calc(100% - 32px))}
.bossbar b{display:block;font:400 18px/1 var(--hand);color:#fff8e6;text-shadow:var(--ol);margin-bottom:5px}
.bossbar .bar{height:14px;background:var(--cham);border:2px solid var(--than);overflow:hidden;box-shadow:inset 0 0 0 1px var(--giay-line)}
.bossbar i{display:block;height:100%;width:100%;background:var(--son);transition:width .25s ease}
.bossbar.p2 i{background:var(--vang);animation:hintPulse .6s ease-in-out infinite}
.bossbar.p3 i{background:#c2187a;animation:hintPulse .35s ease-in-out infinite}

/* comic: printed panels on the cloth */
.comic{width:min(920px,100%)}
.strip{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:12px}
.frame{background:var(--giay);color:var(--than);border-radius:2px;overflow:hidden;display:flex;flex-direction:column;animation:panelIn .4s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i) * .3s)}
.frame canvas{width:100%;aspect-ratio:24/17;display:block}
.frame p{font-size:14px;line-height:1.5;padding:9px 12px 12px;max-width:none;color:var(--than)}
@media (max-width:600px){.strip{grid-template-columns:1fr}}

/* shop, book, achievements, leaderboard: rows of cloth patches */
.tabs{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--giay-line)}
.tabs .btn{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 14px 9px;color:var(--giay-dim)}
.tabs .btn.on{color:var(--giay);border-bottom-color:var(--son)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.item,.card-rat,.ach,.lb-row,.step{background:rgba(243,233,211,.05);border:1px solid var(--giay-line);border-radius:4px;min-width:0}
.item{padding:10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.item canvas{width:100%;max-width:100%;height:auto;aspect-ratio:11/8;border-radius:2px}
.item b{font:700 15px/1.2 var(--body);color:#fff8e6}
.item span{font-size:12px;line-height:1.4;color:var(--giay-dim)}
.item .pill{align-self:flex-start}
.item.locked canvas{filter:grayscale(1) brightness(.7)}
.item.using{border-color:var(--vang);box-shadow:inset 0 0 0 1px var(--vang)}
.item .btn{font-size:13px;padding:7px 12px;margin-top:auto}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.card-rat{padding:8px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.card-rat canvas{width:90px;height:90px}
.card-rat b{font:700 13px/1.2 var(--body)}
.card-rat span{font-size:11px;color:var(--giay-dim)}
.card-rat.miss b{color:var(--giay-dim)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ach{display:flex;gap:10px;align-items:center;padding:9px 12px}
.ach svg{width:40px;height:40px;flex:none}
.ach>div{min-width:0;flex:1}
.ach b{display:block;font:700 14px/1.2 var(--body);color:#fff8e6}
.ach span{display:block;font-size:12px;color:var(--giay-dim);line-height:1.4}
.ach small{font:600 11px var(--body);color:var(--giay-dim)}
.ach.got{border-color:var(--vang);background:rgba(233,177,58,.1)}
.pbar{height:5px;background:var(--giay-line);margin-top:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--la)}
.lb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:min(52vh,460px);overflow:auto}
.lb-row{display:grid;grid-template-columns:34px 32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 12px}
.lb-row.me{border-color:var(--vang);background:rgba(233,177,58,.1)}
.lb-row .rk{font:400 20px/1 var(--hand);text-align:center}
.lb-row:nth-child(1) .rk{color:var(--vang);font-size:24px}.lb-row:nth-child(2) .rk{color:#c9ccd2}.lb-row:nth-child(3) .rk{color:#d08a4a}
.lb-row img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--cham-2)}
.lb-row .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .sc{font:700 15px/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.lb-empty{text-align:center;color:var(--giay-dim);padding:22px 10px;line-height:1.5}
.replay-tag{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:10px;background:var(--cham-glass);color:var(--giay);border-radius:4px;padding:8px 14px;font:700 14px/1 var(--body);letter-spacing:.12em;pointer-events:none;white-space:nowrap}
.replay-tag i{width:9px;height:9px;border-radius:50%;background:var(--son);animation:hintPulse .8s ease-in-out infinite}
.replay-tag small{font:500 12px var(--body);letter-spacing:0;opacity:.7}
.rushrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rushrow canvas{width:46px;height:46px;filter:grayscale(1);opacity:.45}
.rushrow canvas.got{filter:none;opacity:1}

/* in-game item pouch */
.itembar{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:8px;padding:8px;background:var(--cham-glass);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:6px;border-top:3px solid var(--vang)}
.itm{position:relative;width:48px;height:48px;padding:5px;border:1px solid var(--giay-line);border-radius:4px;background:var(--cham-2);cursor:pointer;transition:transform .12s,opacity .15s,border-color .15s}
.itm canvas{width:100%;height:100%;display:block;pointer-events:none}
.itm i{position:absolute;right:-6px;top:-6px;min-width:19px;height:19px;padding:0 4px;border-radius:3px;background:var(--son);color:#fff;font:700 11px/19px var(--body);font-style:normal;text-align:center;box-sizing:border-box}
.itm:hover:not(:disabled){border-color:var(--vang)}
.itm:active:not(:disabled){transform:translateY(1px)}
.itm:disabled{opacity:.4;cursor:default}
.itm.empty i{background:var(--cham-3)}
.itm.on{border-color:var(--la);box-shadow:inset 0 0 0 2px var(--la);opacity:1}
.itm:focus-visible{outline:2px solid var(--vang);outline-offset:2px}
@media (max-width:640px){.itm{width:40px;height:40px;padding:4px}.itembar{gap:6px;padding:6px}}
@media (max-height:520px){.itembar{top:calc(env(safe-area-inset-top,0px) + 70px);transform:none;flex-direction:row;gap:6px;padding:5px;border-top:0;border-left:3px solid var(--vang)}.itm{width:36px;height:36px;padding:3px}}

/* fruit workshop & share code */
.forge{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
.fprev{display:flex;flex-direction:column;gap:10px;position:sticky;top:0}
.fprev canvas{width:100%;aspect-ratio:14/9;border-radius:3px;display:block}
.fprev input,.importbox input,.codebox{font:600 17px/1.2 var(--body);color:var(--than);background:var(--giay);border:0;border-radius:3px;padding:9px 12px;box-sizing:border-box}
.fprev input{width:100%;text-align:center;font:400 22px/1.2 var(--hand)}
.fprev input:focus-visible,.importbox input:focus-visible{outline:2px solid var(--vang);outline-offset:2px}
.fopts{display:flex;flex-direction:column;gap:12px;min-width:0}
.fg b{display:block;font:700 13px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--vang);margin-bottom:6px}
.fg small{font:500 12px var(--body);letter-spacing:0;text-transform:none;color:var(--giay-dim);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{font:600 13px/1 var(--body);color:var(--giay);background:var(--cham-2);border:1px solid var(--giay-line);border-radius:3px;padding:8px 11px;cursor:pointer}
.chipbtn:hover{border-color:var(--vang)}
.chipbtn.on{background:var(--son);border-color:var(--son);color:#fff}
.chipbtn:focus-visible{outline:2px solid var(--vang);outline-offset:2px}
@media (max-width:640px){.forge{grid-template-columns:1fr}.fprev{position:static}}
.importbox{display:flex;gap:8px;flex-wrap:wrap}
.importbox input{font-family:ui-monospace,Menlo,Consolas,monospace;min-width:0;flex:1 1 220px;max-width:420px}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;width:100%;text-align:center;font-size:18px;letter-spacing:.04em;user-select:all;-webkit-user-select:all}

/* tutorial cards */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.step{padding:12px 10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.step svg{width:56px;height:56px}
.step b{font:400 22px/1 var(--hand);color:#fff8e6}
.step span{font-size:13px;line-height:1.45;color:var(--giay-dim)}
.art{width:150px;height:150px;border-radius:3px;display:block}
.fruit-hero{width:140px;height:140px;align-self:center;animation:wob 1.4s ease-in-out infinite}
.pill{align-self:flex-start;font:700 12.5px/1 var(--body);letter-spacing:.04em;background:var(--vang);color:var(--than);padding:7px 11px;border-radius:3px}

/* wipe: a bolt of indigo cloth with the woven band */
#wipe{position:fixed;inset:0;z-index:20;pointer-events:none;clip-path:circle(0% at 50% 50%);
  background:linear-gradient(45deg,transparent 45%,rgba(233,177,58,.18) 45% 55%,transparent 55%) 0 0/28px 28px,linear-gradient(-45deg,transparent 45%,rgba(196,57,43,.2) 45% 55%,transparent 55%) 0 0/28px 28px,var(--cham)}

@media (max-width:600px){
  .btn.icon{width:40px;height:40px}
  .lvl-chip b{display:none}
  .lvl-chip small{font:700 11.5px/1.2 var(--body);letter-spacing:0;text-transform:none;color:var(--giay);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lvl-chip{padding:8px 7px;overflow:hidden}
  .hud{gap:6px}.hud-left{gap:5px}
  .score-num{font-size:21px}
  .scorebox{min-width:0;padding:4px 12px 6px}
  .rats svg{width:13px;height:13px}
  .ammo{padding:5px 6px;gap:2px}
  .ammo canvas{width:24px;height:24px}
  .node .name{display:none}
  .steps{grid-template-columns:1fr}
  .step{flex-direction:row;align-items:center}
  .step svg{width:44px;height:44px;flex:none}
  .panel{padding:26px 16px 18px}
  .btn.xl{font-size:24px;padding:11px 28px 13px}
}
@media (prefers-reduced-motion:reduce){
  .hint.pulse,.fruit-hero,.marker,.lose-art,.node.current .nodebtn::after,.title,.panel,.frame{animation:none!important}
}

function spikeBurst(c0) {

function genWave(b, wv) {
  const slots = [1000, 1200, 1400], count = Math.min(3, 1 + Math.floor(wv / 2));
  const chosen = slots.slice().sort(() => Math.random() - .5).slice(0, count);
  const mat = () => pick(wv < 3 ? ['wood', 'wood', 'glass'] : wv < 6 ? ['wood', 'glass', 'stone'] : ['wood', 'stone', 'stone', 'glass']);
  for (const cx of chosen) {
    const k = Math.floor(Math.random() * 5);
    if (k === 0) {
      let base = G, w = 140; const fl = 1 + Math.floor(Math.random() * Math.min(3, 1 + wv / 3));
      for (let i = 0; i < fl; i++) { b.rat(cx, base - 20); base = b.frame(cx, base, w, 80 + Math.floor(Math.random() * 30), mat(), mat()); w -= 25; }
      b.rat(cx, base - 20);
    } else if (k === 1) { b.pyramid(cx, G, 3, 36, mat()); b.rat(cx, G - 128); }
    else if (k === 2) { const t = b.bunker(cx, G, 150, 90, 'stone'); b.rat(cx, G - 20); b.rat(cx, t - 20); }
    else if (k === 3) { const t = b.col(cx, G, 2 + Math.floor(Math.random() * 2), 40, mat()); b.rat(cx, t - 20); b.barrel(cx + 50, G); }
    else { const t = b.frame(cx, G, 120, 70, mat(), 'wood'); b.rat(cx, G - 20); b.rat(cx, t - 20); b.barrel(cx + 80, G); }
  }

// ================= LOOP =================
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1), cw = innerWidth, ch = innerHeight;

  view = { dpr, cw, ch };
  const bg = $('mapbg'); if (bg) paintMap(bg, CHAPTERS[mapChapter].map);
  if (engine) updateHud();
}
addEventListener('resize', resize);
let last = performance.now(), acc = 0;
function loop(now) {
  const dt = Math.min(100, now - last); last = now; realTime += dt;
  const target = realTime < slowUntil ? .28 : 1; timeScale += (target - timeScale) * .15;
  const running = engine && state !== 'paused' && state !== 'replay' && (screen === 'game' || state === 'attract') && realTime >= hitStopUntil;
  frameDt = dt; edgeGlow *= Math.pow(.25, dt / 1000); bars += ((realTime < cineUntil ? 1 : 0) - bars) * Math.min(1, dt / 120);
  if (running) {
    acc += dt * timeScale; let n = 0;

  if (engine) { if (replay) renderReplay(dt); else { updateCamera(dt); render(); } }
  if (screen === 'game') tickScore(dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}
